name: Visibility Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install curl jq python deps
        run: sudo apt-get update && sudo apt-get install -y jq python3-pip
      - name: Run visibility audit
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          chmod +x scripts/visibility_audit.sh
          BASE_URL="${SITE_URL:-https://aistatusdashboard.com}" OUT_DIR=artifacts ./scripts/visibility_audit.sh
      - name: Score
        run: python3 scripts/visibility_score.py
      - name: Fail if low score
        run: python3 scripts/visibility_check.py
