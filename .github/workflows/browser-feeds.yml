name: Browser feeds

# Official status pages that block plain HTTP clients (Mistral on Rootly sits
# behind a Cloudflare JavaScript challenge with no JSON or RSS) are rendered
# in a real browser here and posted to the site every 15 minutes.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: browser-feeds
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/browser-feeds.mjs
            lib/data/sources.json
          sparse-checkout-cone-mode: false

      - name: Install Playwright package
        run: npm install --no-save --no-audit --no-fund playwright@1.57.0

      - name: Render and post
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://aistatusdashboard.com
        run: node scripts/browser-feeds.mjs
