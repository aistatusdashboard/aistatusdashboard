name: Changelog Autolog

on:
  workflow_run:
    workflows: ["Deploy App Hosting"]
    types: [completed]

jobs:
  append:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update changelog artifacts
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_SUBJECT: ${{ github.event.workflow_run.display_title }}
        run: node scripts/changelog-autolog.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changelog update needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/changelog.json docs/changelog.md
          git commit -m "chore: autolog successful deploy"
          git push origin HEAD:main
