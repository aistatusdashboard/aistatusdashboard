name: Deploy App Hosting

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: apphosting-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Deploy App Hosting
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "App Hosting deploy attempt ${attempt}/5"
            set +e
            output=$(npx firebase-tools deploy --only apphosting --project ai-status-dashboard --token "$FIREBASE_TOKEN" --non-interactive 2>&1)
            status=$?
            set -e
            echo "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if echo "$output" | grep -q 'HTTP Error: 409, unable to queue the operation'; then
              if [ "$attempt" -lt 5 ]; then
                echo "App Hosting queue busy (409). Retrying in 30s..."
                sleep 30
                continue
              fi
            fi
            exit "$status"
          done
          exit 1

      - name: Post-deploy smoke check
        run: |
          set -e
          urls=(
            "https://aistatusdashboard.com/"
            "https://aistatusdashboard.com/chatgpt"
            "https://aistatusdashboard.com/incidents"
            "https://aistatusdashboard.com/sitemap.xml"
            "https://aistatusdashboard.com/robots.txt"
            "https://aistatusdashboard.com/og.png"
            "https://aistatusdashboard.com/favicon.ico"
          )
          for url in "${urls[@]}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [ "$code" != "200" ]; then
              echo "Smoke check failed: $url returned $code"
              exit 1
            fi
          done
          html=$(curl -sS "https://aistatusdashboard.com/")
          echo "$html" | grep -qi "checked\|All quiet\|having issues\|Checking every AI" || (echo "Homepage missing live verdict" && exit 1)
