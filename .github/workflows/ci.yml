name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Rapid consecutive pushes supersede each other instead of running a full test
# matrix per commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Boot and smoke check
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 >/tmp/ai-status-start.log 2>&1 &
          ok=""
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:3000/about" >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            cat /tmp/ai-status-start.log
            exit 1
          fi
          curl -fsS "http://127.0.0.1:3000/" >/dev/null
          curl -fsS "http://127.0.0.1:3000/chatgpt" >/dev/null
          curl -fsS "http://127.0.0.1:3000/how-it-works" >/dev/null
          curl -fsS "http://127.0.0.1:3000/sitemap.xml" >/dev/null
          curl -fsS "http://127.0.0.1:3000/robots.txt" >/dev/null
